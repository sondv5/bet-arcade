name: Feature request

description: Suggest a new mini-game, feature or improvement
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea and why it would be fun in a real group setting.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Which category does it fit into?
      options:
        - Pick one person
        - Find the last place
        - Teams & pairs
        - UI / UX
        - Infrastructure / PWA
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Mockups, links, translations you would be happy to provide, etc.
