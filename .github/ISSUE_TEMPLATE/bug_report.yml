name: Bug report

description: Something in BÉT! is broken
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! 🐛 Please fill in the details below so it can be reproduced.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behaviour.
      placeholder: The wheel stopped on the wrong name…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The wheel should stop exactly between two labels.
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Which mini-game is affected?
      options:
        - Home / dashboard
        - Wheel of Goodbye
        - Plinko of Fate
        - Lucky Slots
        - Hot Bomb
        - Snail Race
        - Skull Card
        - Hammer of Fate
        - Team Machine
        - Gacha Teams
        - Pair Machine
        - Other / global
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & version
      placeholder: Chrome 141 / Safari 18 / Firefox 133
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Windows 11 laptop / iPhone 15 / Pixel 8
    validations:
      required: true

  - type: input
    id: players
    attributes:
      label: Number of players
      placeholder: 8

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Console output, screenshots, or anything else useful.
